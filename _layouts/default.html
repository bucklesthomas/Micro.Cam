<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234da3e0'/><text x='50' y='72' font-family='Baskerville,Georgia,serif' font-size='68' font-weight='700' text-anchor='middle' fill='white'>M</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <div class="site-search" role="search">
      <svg class="ss-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="ss" type="search" placeholder="Search links, scores, trials" aria-label="Search the whole site" autocomplete="off" role="combobox" aria-controls="ss-results" aria-expanded="false" aria-autocomplete="list">
      <kbd class="ss-kbd" aria-hidden="true">/</kbd>
      <div id="ss-results" class="ss-results" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <nav>
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Links</a>
      <a href="{{ '/scores/' | relative_url }}" {% if page.url == '/scores/' %}aria-current="page"{% endif %}>Scores</a>
      <a href="{{ '/trials/' | relative_url }}" {% if page.url == '/trials/' %}aria-current="page"{% endif %}>Trials</a>
      <a href="{{ '/endocarditis/' | relative_url }}" {% if page.url == '/endocarditis/' %}aria-current="page"{% endif %}>Endocarditis</a>
    </nav>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="wrap footer">
    For use by qualified clinicians as a convenience only. Scores are aids, not substitutes for clinical judgement — always check local and national guidance.
  </footer>

  <script src="{{ '/assets/js/sitesearch.js' | relative_url }}?v={{ site.time | date: '%s' }}" data-index="{{ '/search.json' | relative_url }}?v={{ site.time | date: '%s' }}" data-base="{{ '/' | relative_url }}"></script>
  {% for s in page.scripts %}<script src="{{ s | relative_url }}?v={{ site.time | date: '%s' }}"></script>{% endfor %}
</body>
</html>
