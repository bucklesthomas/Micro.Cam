<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦠</text></svg>">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}"><span aria-hidden="true">🦠</span> {{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Links</a>
      <a href="{{ '/scores/' | relative_url }}" {% if page.url == '/scores/' %}aria-current="page"{% endif %}>Scores</a>
    </nav>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="wrap footer">
    For use by qualified clinicians as a convenience only. Scores are aids, not substitutes for clinical judgement — always check local and national guidance.
  </footer>

  {% for s in page.scripts %}<script src="{{ s | relative_url }}"></script>{% endfor %}
</body>
</html>
